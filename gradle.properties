# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.14.23
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.diamondambilight.supersword

# Dependencies
fabric_api_version=0.92.11+1.20.1

# --- 本地代理设置(Clash Verge 127.0.0.1:7897) ---
# 让可直连的 Maven/Minecraft 下载源直连，其余(如 GitHub)才走代理。
# 以后要分享/发布项目，可删掉下面这段。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=*.fabricmc.net|*.maven.apache.org|*.minecraft.net|*.mojang.com|*.gradle.org|*.aliyun.com|*.modrinth.com
systemProp.https.nonProxyHosts=*.fabricmc.net|*.maven.apache.org|*.minecraft.net|*.mojang.com|*.gradle.org|*.aliyun.com|*.modrinth.com
